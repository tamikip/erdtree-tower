<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>黄金树爬塔启动器</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css?v=1.1.2">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/pages.css?v=1.1.2">
</head>
<body>
<div id="app">

  <!-- 背景层（官方 .hyp-background-player）
       顺序：视频 / 底图 → 标题叠层 → 暗角 → 竖向渐变 -->
  <div class="bg" id="bg">
    <video class="bg-video off" id="bgVideo" muted loop playsinline></video>
    <img class="bg-art" id="bgArt" alt="">
    <img class="bg-title" id="bgTitle" alt="">
    <img class="bg-vignette" id="bgVignette" alt="">
    <div class="bg-scrim" id="bgScrim"></div>
  </div>

  <!-- 背景切换器（官方 #hyp-background-switcher，顶部居中，悬停显现） -->
  <div class="bg-switch" id="bgSwitch"><div class="dots" id="bgDots"></div></div>

  <!-- 左侧侧栏（官方 aside.app-sidebar > .hyp-side-bar）
       顶部 logo，底部游戏图标列表 + 分隔线 + 添加游戏按钮 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__top">
      <a class="logo" id="sidebarLogo" href="#" data-tip="回到游戏列表" data-tip-place="right">
        <img src="assets/icons/tower-icon.png" alt="黄金树爬塔">
      </a>
    </div>
    <div class="sidebar__bottom" id="sidebarBottom"></div>
  </aside>

  <!-- 顶栏拖拽区（官方 #hyp-drag-header，1148x48） -->
  <header class="topbar" id="dragHeader" data-drag><span class="launcher-author" aria-label="作者 TamikiP">TamikiP</span></header>

  <!-- 窗口控制 -->
  <div class="winctl" id="winctl"></div>

  <!-- 右侧社交栏（官方 .hyp-game-social-media） -->
  <nav class="social" id="social"></nav>

  <!-- 页面容器 -->
  <main id="view"></main>

</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/bridge.js"></script>
<script src="js/vendor/markdown-it.min.js"></script>
<script src="js/release-notes.js"></script>
<script src="js/app.js?v=1.1.2"></script>
</body>
</html>
